
name: Build Reseil Simulator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and unpack project
        run: |
          set -e
          if [ ! -d game ] && [ -f ReseilSimulator_Android_Project.zip ]; then
            unzip -o ReseilSimulator_Android_Project.zip -d extracted
          fi
          if [ ! -d game ]; then
            echo "ERROR: Project folder game not found"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "Project found:"
          ls -la game
          if [ ! -f game/gradlew ]; then
            echo "No wrapper found; installing Gradle"
            sudo apt-get update
            sudo apt-get install -y gradle
            cd game
            gradle wrapper
          fi

      - name: Build APK
        working-directory: game
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReseilSimulator-APK
          path: game/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          


name: Build Reseil Simulator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Locate and unpack project
        run: |
          if [ ! -f gradlew ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No gradlew or project ZIP found"
              exit 1
            fi
            mkdir -p game
            unzip -q "$ZIP_FILE" -d game
          fi

          WRAPPER=$(find . -type f -name gradlew \
            -not -path './.git/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No Gradle wrapper found in project"
            find . -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReseilSimulator-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
